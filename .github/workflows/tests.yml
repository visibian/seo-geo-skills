name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the oldest Python the scripts support. GitHub's newest Ubuntu runner has no 3.9 build,
          # so it runs on Ubuntu 24.04, which still has one.
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
          - python: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_scripts.py
