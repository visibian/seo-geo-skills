name: Something does not work
description: A skill or a script gave a wrong result, an error, or advice that is out of date.
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: seo-audit
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you ran or asked, and what happened
      description: The command or your request, the output, and what you expected instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you ran it
      placeholder: Claude Code 2.x on macOS, Python 3.12
  - type: textarea
    id: source
    attributes:
      label: Source, if advice is out of date
      description: A link to the current documentation or study, with its date.
